<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini POS - Kasir & Keranjang Belanja</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Kantin ITERA - Mini Pos</h1>
      <p>Mini Point of Sales (POS)</p>
    </header>

    <main class="grid-layout">
      <!-- Form Input Barang -->
      <section class="card">
        <h2>Input Barang</h2>
        <form id="formBarang" novalidate>
          <div class="form-group">
            <label for="namaBarang">Nama Barang</label>
            <input type="text" id="namaBarang" placeholder="Input Nama Barang" />
            <small class="error-text" id="errNama"></small>
          </div>

          <div class="form-group">
            <label for="hargaBarang">Harga Satuan (Rp)</label>
            <input type="number" id="hargaBarang" placeholder="Min. 500" />
            <small class="error-text" id="errHarga"></small>
          </div>

          <div class="form-group">
            <label for="qtyBarang">Jumlah (Qty)</label>
            <input type="number" id="qtyBarang" placeholder="Min. 1" value="1" />
            <small class="error-text" id="errQty"></small>
          </div>

          <button type="submit" class="btn btn-primary">Tambah ke Keranjang</button>
        </form>
      </section>

      <!-- Ringkasan & Pembayaran -->
      <section class="card">
        <h2>Kalkulator Pembayaran</h2>
        <div class="summary-box">
          <p>Subtotal: <span id="txtSubtotal">Rp 0</span></p>
          <p>Diskon (10% min. Rp 50.000 / Coupon): <span id="txtDiskon">Rp 0</span></p>
          <h3>Total Bayar: <span id="txtTotal">Rp 0</span></h3>
        </div>

        <div class="form-group margin-top">
          <label for="kodePromo">Kode Promo (Opsional: HEMAT10)</label>
          <input type="text" id="kodePromo" placeholder="Masukkan kode promo" />
        </div>

        <div class="form-group">
          <label for="uangBayar">Uang Bayar (Rp)</label>
          <input type="number" id="uangBayar" placeholder="Nominal uang diterima" />
          <small class="error-text" id="errBayar"></small>
        </div>

        <div class="info-box" id="infoKembalian">
          Kembalian: <strong id="txtKembalian">Rp 0</strong>
        </div>

        <button id="btnReset" class="btn btn-danger margin-top">Transaksi Baru / Reset</button>
      </section>
    </main>

    <!-- Tabel Keranjang Belanja -->
    <section class="card margin-top">
      <h2>Daftar Keranjang Belanja</h2>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>No</th>
              <th>Nama Barang</th>
              <th>Harga Satuan</th>
              <th>Qty</th>
              <th>Subtotal</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="bodyTabel">
            <!-- Data dimasukkan via JavaScript -->
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
